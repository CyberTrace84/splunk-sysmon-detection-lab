<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Splunk + Sysmon detection lab architecture</title>
  <desc>A Windows 11 endpoint with Sysmon and the Splunk Universal Forwarder sends logs over TCP 9997 to a Splunk Enterprise server on Ubuntu. Four scheduled alerts raise triggered alerts, which are written up as incident tickets.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2d3748"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#ffffff"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#1a202c">Splunk + Sysmon detection lab: architecture</text>

  <!-- Host -->
  <rect x="30" y="70" width="900" height="330" rx="12" fill="#f7fafc" stroke="#6b7a8a" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="46" y="94" font-size="13" fill="#2d3748">Host: Windows 11 laptop running VMware Workstation Pro (NAT network)</text>

  <!-- Windows VM -->
  <rect x="60" y="115" width="330" height="255" rx="10" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="75" y="142" font-size="16" font-weight="700" fill="#1a202c">Windows 11 endpoint VM</text>
  <rect x="80" y="160" width="290" height="44" rx="6" fill="#ffffff" stroke="#2b6cb0"/>
  <text x="225" y="187" font-size="13" text-anchor="middle" fill="#1a202c">Sysmon (SwiftOnSecurity config)</text>
  <rect x="80" y="214" width="290" height="44" rx="6" fill="#ffffff" stroke="#2b6cb0"/>
  <text x="225" y="241" font-size="13" text-anchor="middle" fill="#1a202c">Splunk Universal Forwarder</text>
  <rect x="80" y="268" width="290" height="44" rx="6" fill="#ffffff" stroke="#2b6cb0"/>
  <text x="225" y="295" font-size="13" text-anchor="middle" fill="#1a202c">Windows Security + System event logs</text>
  <line x1="225" y1="204" x2="225" y2="214" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="225" y1="268" x2="225" y2="258" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="80" y="342" font-size="12" font-style="italic" fill="#2d3748">Attack simulations run here (PowerShell, net, schtasks)</text>

  <!-- Ubuntu VM -->
  <rect x="570" y="115" width="330" height="255" rx="10" fill="#f0fff4" stroke="#2f855a" stroke-width="1.5"/>
  <text x="585" y="142" font-size="16" font-weight="700" fill="#1a202c">Ubuntu Server VM</text>
  <rect x="590" y="160" width="290" height="44" rx="6" fill="#ffffff" stroke="#2f855a"/>
  <text x="735" y="187" font-size="13" text-anchor="middle" fill="#1a202c">Splunk Enterprise (index: main)</text>
  <rect x="590" y="214" width="290" height="44" rx="6" fill="#ffffff" stroke="#2f855a"/>
  <text x="735" y="241" font-size="13" text-anchor="middle" fill="#1a202c">Receiving port 9997, web UI port 8000</text>
  <rect x="590" y="268" width="290" height="44" rx="6" fill="#ffffff" stroke="#2f855a"/>
  <text x="735" y="295" font-size="13" text-anchor="middle" fill="#1a202c">UFW: allow only 8000 and 9997</text>

  <!-- Log flow -->
  <line x1="370" y1="236" x2="590" y2="236" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="226" font-size="13" text-anchor="middle" fill="#1a202c">logs over TCP 9997</text>

  <!-- Analyst browser -->
  <rect x="410" y="300" width="140" height="50" rx="6" fill="#ffffff" stroke="#4a5568"/>
  <text x="480" y="321" font-size="13" text-anchor="middle" fill="#1a202c">Analyst browser</text>
  <text x="480" y="339" font-size="12" text-anchor="middle" fill="#2d3748">searches, alerts</text>
  <line x1="550" y1="325" x2="590" y2="325" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="480" y="368" font-size="12" text-anchor="middle" fill="#2d3748">web UI over TCP 8000</text>

  <!-- Alerts pipeline -->
  <path d="M600 370 L600 412 L185 412 L185 425" fill="none" stroke="#2d3748" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="392" y="406" font-size="12" text-anchor="middle" fill="#2d3748">alerts run inside Splunk</text>

  <rect x="60" y="425" width="250" height="110" rx="8" fill="#fffaf0" stroke="#b7791f" stroke-width="1.5"/>
  <text x="75" y="448" font-size="15" font-weight="700" fill="#1a202c">4 scheduled alerts (every 5 min)</text>
  <text x="75" y="472" font-size="13" fill="#1a202c">T1110.001 Brute force</text>
  <text x="75" y="490" font-size="13" fill="#1a202c">T1059.001 Suspicious PowerShell</text>
  <text x="75" y="508" font-size="13" fill="#1a202c">T1136.001 New local admin</text>
  <text x="75" y="526" font-size="13" fill="#1a202c">T1053.005 Scheduled task</text>

  <line x1="310" y1="480" x2="370" y2="480" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="370" y="445" width="220" height="70" rx="8" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/>
  <text x="480" y="475" font-size="14" font-weight="700" text-anchor="middle" fill="#1a202c">Splunk Triggered Alerts</text>
  <text x="480" y="495" font-size="12" text-anchor="middle" fill="#2d3748">per result, throttled</text>

  <line x1="590" y1="480" x2="650" y2="480" stroke="#2d3748" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="650" y="445" width="250" height="70" rx="8" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/>
  <text x="775" y="475" font-size="14" font-weight="700" text-anchor="middle" fill="#1a202c">L1 incident tickets</text>
  <text x="775" y="495" font-size="12" text-anchor="middle" fill="#2d3748">INC-001 to INC-004 in /reports</text>
</svg>
